name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          JEV_BROWSER_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Live end-to-end navigation only when a TYPESAFE_API_KEY secret is set.
      - name: Install Chromium for e2e
        if: env.TYPESAFE_API_KEY != ''
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: npx playwright install --with-deps chromium
      - name: Transport integration (optional)
        if: env.TYPESAFE_API_KEY != ''
        run: node --test test/transports.test.mjs
      - name: End-to-end (optional)
        if: env.TYPESAFE_API_KEY != ''
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run test:e2e
