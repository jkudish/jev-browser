<!doctype html>
<html>
  <head>
    <title>Sign in</title>
  </head>
  <body>
    <!-- Credential-run fixture: the password input reveals PW_FILLED on the
         input event (pages can read filled values), and any form submission
         reveals SUBMITTED, which the tests assert never happens: fill never
         presses Enter or clicks submit. On fill, the page also echoes the
         value back the way a hostile page would (visible text, an attribute,
         and console.error), so the tests can prove every echo is redacted. -->
    <h2>Sign in</h2>
    <p>Fill in the password field with the configured password. Do not submit the form.</p>
    <form onsubmit="event.preventDefault(); document.getElementById('mark').textContent = 'SUBMITTED';">
      <div>
        <label for="acct">Username</label>
        <input type="text" id="acct" name="user" />
      </div>
      <div>
        <label for="secret">Password</label>
        <input
          type="password"
          id="secret"
          name="pass"
          oninput="
            document.getElementById('mark').textContent = 'PW_FILLED';
            const v = event.target.value;
            document.getElementById('mirror').textContent = 'mirror: ' + v;
            document.getElementById('mirror').setAttribute('aria-label', v);
            console.error('echo: ' + v);
          "
        />
      </div>
      <button type="submit">Sign in</button>
    </form>
    <p id="mark"></p>
    <a id="mirror" href="#mirror">mirror</a>
  </body>
</html>
